# charts/feature-platform/templates/flink-cluster.yaml
#
# Key fix: TaskManager must be a StatefulSet, not a Deployment.
#
# Headless Service + subdomain creates per-pod DNS records ONLY for
# StatefulSet pods. For Deployment pods the subdomain field is ignored
# by kube-dns — the pod hostname is never registered, causing:
#   UnknownHostException: <pod-name>.<subdomain>.<ns>.svc.cluster.local
#
# StatefulSet pods get stable, predictable DNS names:
#   flink-taskmanager-0.flink-taskmanager-hl.feature-platform.svc.cluster.local
# This is resolvable by the JobManager, allowing slot assignment to succeed.

# JobManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: feature-platform
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: jobmanager
          image: "{{ .Values.streamProcessor.image.repository }}:{{ .Values.streamProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.streamProcessor.image.pullPolicy }}
          command:
            - python
            - src/start_jobmanager.py
          ports:
            - name: ui
              containerPort: 8081
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-jobmanager
            - name: FLINK_REST_BIND_ADDRESS
              value: "0.0.0.0"
            - name: FLINK_REST_ADDRESS
              value: flink-jobmanager
            - name: FLINK_JM_BIND_HOST
              value: "0.0.0.0"
            - name: FLINK_JM_RPC_ADDRESS
              value: flink-jobmanager
          envFrom:
            - configMapRef:
                name: feature-platform-config
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 20
            periodSeconds:       10

---
# JobManager ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: feature-platform
  labels:
    app: flink
    component: jobmanager
spec:
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: ui
      port: 8081
      targetPort: 8081
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: blob-server
      port: 6125
      targetPort: 6125

---
# JobManager UI NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-ui
  namespace: feature-platform
  labels:
    app: flink
    component: jobmanager-ui
spec:
  type: NodePort
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: ui
      port:       8081
      targetPort: 8081
      nodePort:   {{ .Values.flink.uiNodePort }}

---
# TaskManager headless Service
# Required for StatefulSet pod DNS registration.
# Creates DNS A records:
#   flink-taskmanager-0.flink-taskmanager-hl.feature-platform.svc.cluster.local
#   flink-taskmanager-1.flink-taskmanager-hl.feature-platform.svc.cluster.local
#   ...
# The serviceName in the StatefulSet spec must match this Service name.
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager-hl
  namespace: feature-platform
  labels:
    app: flink
    component: taskmanager
spec:
  clusterIP: None
  selector:
    app: flink
    component: taskmanager
  ports:
    - name: data
      port: 6121
      targetPort: 6121
    - name: ipc
      port: 6122
      targetPort: 6122

---
# TaskManager StatefulSet
# StatefulSet (not Deployment) so each pod gets a stable DNS name via the
# headless Service above. Pod names are ordinal: flink-taskmanager-0, -1, etc.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flink-taskmanager
  namespace: feature-platform
  labels:
    app: flink
    component: taskmanager
spec:
  serviceName: flink-taskmanager-hl   # must match the headless Service name
  replicas: {{ .Values.flink.taskManagerReplicas }}
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: taskmanager
          image: "{{ .Values.streamProcessor.image.repository }}:{{ .Values.streamProcessor.image.tag }}"
          imagePullPolicy: {{ .Values.streamProcessor.image.pullPolicy }}
          command:
            - python
            - src/start_taskmanager.py
          ports:
            - name: data
              containerPort: 6121
            - name: ipc
              containerPort: 6122
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-jobmanager
            - name: FLINK_JM_RPC_ADDRESS
              value: flink-jobmanager
            - name: FLINK_TM_BIND_HOST
              value: "0.0.0.0"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feature-platform-secrets
                  key: db-password
          envFrom:
            - configMapRef:
                name: feature-platform-config
          resources:
            requests:
              cpu:    {{ .Values.flink.taskManager.resources.requests.cpu | quote }}
              memory: {{ .Values.flink.taskManager.resources.requests.memory | quote }}
            limits:
              cpu:    {{ .Values.flink.taskManager.resources.limits.cpu | quote }}
              memory: {{ .Values.flink.taskManager.resources.limits.memory | quote }}