# values.yaml — feature-platform chart

# -------------------------------------------------------------------
# Shared config
# -------------------------------------------------------------------
config:
  dataset:      "FD002"
  gcpProject:   "aide2-494008"
  gcpRegion:    "us-central1"
  gcsBucket:    "phm-raw-data-aide2-494008"
  windowSize:   "24"       # rolling window length per engine
  rulCap:       "125"      # piecewise linear RUL cap

# -------------------------------------------------------------------
# Redis (online store) — from: terraform output redis_host
# -------------------------------------------------------------------
redis:
  host: "10.72.0.3"   # terraform output redis_host
  port: "6379"

# -------------------------------------------------------------------
# PostgreSQL (offline store) — from: terraform output db_private_ip
# -------------------------------------------------------------------
postgres:
  host:     "10.72.1.3"  # terraform output db_private_ip
  port:     "5432"
  database: "phmdb"
  username: "phmadmin"
  # password injected via Kubernetes Secret — feature-platform-secrets

# -------------------------------------------------------------------
# Stream Processor — PyFlink CronJob
# Runs 3 min after validation service completes (validator runs at */5)
# PyFlink chosen over full Flink cluster to stay within e2-standard-4
# resource budget (no separate JobManager + TaskManager JVMs needed).
# Single pod runs PyFlink in local execution mode — sufficient for the
# 24-cycle windowed aggregation workload on this dataset size.
# -------------------------------------------------------------------
streamProcessor:
  schedule: "3-58/5 * * * *"
  image:
    repository: us-central1-docker.pkg.dev/aide2-494008/phm-stream-processor/stream-processor
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu:    "250m"
      memory: "512Mi"    # increased from 256Mi — PyFlink JVM needs headroom
    limits:
      cpu:    "500m"
      memory: "1Gi"      # hard cap — stays well within e2-standard-4 (16GB)

# -------------------------------------------------------------------
# ServiceAccount / Workload Identity
# -------------------------------------------------------------------
serviceAccount:
  name: feature-platform-sa
  # Email from: terraform output workload_identity_annotations
  gcpServiceAccount: "phm-feature-platform@aide2-494008.iam.gserviceaccount.com"