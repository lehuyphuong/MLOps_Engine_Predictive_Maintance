config:
  dataset:           "FD002"
  gcpProject:        "aide2-494008"
  gcpRegion:         "us-central1"
  gcsRawBucket:      "phm-raw-data-aide2-494008"
  rulAlertThreshold: "20"
  dbHost:            "10.72.1.3"
  dbPort:            "5432"
  dbName:            "phmdb"
  dbUser:            "phmadmin"

alertEngine:
  schedule: "*/5 * * * *"
  image:
    repository: us-central1-docker.pkg.dev/aide2-494008/phm-alert-engine/alert-engine
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu:    "100m"
      memory: "128Mi"
    limits:
      cpu:    "300m"
      memory: "256Mi"

serviceAccount:
  name: alert-engine-sa
  # Email from: terraform output workload_identity_annotations
  gcpServiceAccount: "phm-alert-engine@aide2-494008.iam.gserviceaccount.com"