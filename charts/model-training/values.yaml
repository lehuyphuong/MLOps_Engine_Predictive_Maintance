postgres:
  host:     "10.72.1.3"  # terraform output db_private_ip
  port:     "5432"
  database: "phmdb"
  username: "phmadmin"

# -------------------------------------------------------------------
# ServiceAccount / Workload Identity
# -------------------------------------------------------------------
serviceAccount:
  name: model-training-sa
  # Email from: terraform output workload_identity_annotations
  gcpServiceAccount: "phm-model-training@aide2-494008.iam.gserviceaccount.com"