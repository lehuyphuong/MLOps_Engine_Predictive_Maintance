# values.yaml — model-training chart

# -------------------------------------------------------------------
# Training config
# -------------------------------------------------------------------
config:
  dataset:              "FD002"
  trainingMode:         "offline"
  nRuns:                "10"
  rulCap:               "125"
  gcpProject:           "aide2-494008"
  gcpRegion:            "us-central1"
  gcsRawBucket:         "phm-raw-data-aide2-494008"
  gcsArtifactsBucket:   "phm-model-artifacts-aide2-494008"
  gcsMlflowBucket:      "phm-mlflow-artifacts-aide2-494008"

# -------------------------------------------------------------------
# PostgreSQL — MLflow backend + feature store
