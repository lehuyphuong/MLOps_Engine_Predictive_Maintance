apiVersion: v1
kind: ConfigMap
metadata:
  name: model-training-config
  namespace: model-training
data:
  DATASET:               {{ .Values.config.dataset | quote }}
  TRAINING_MODE:         {{ .Values.config.trainingMode | quote }}
  N_RUNS:                {{ .Values.config.nRuns | quote }}
  RUL_CAP:               {{ .Values.config.rulCap | quote }}
  GCP_PROJECT:           {{ .Values.config.gcpProject | quote }}
  GCP_REGION:            {{ .Values.config.gcpRegion | quote }}
  GCS_RAW_BUCKET:        {{ .Values.config.gcsRawBucket | quote }}
  GCS_ARTIFACTS_BUCKET:  {{ .Values.config.gcsArtifactsBucket | quote }}
  GCS_MLFLOW_BUCKET:     {{ .Values.config.gcsMlflowBucket | quote }}
  DB_HOST:               {{ .Values.postgres.host | quote }}
  DB_PORT:               {{ .Values.postgres.port | quote }}
  DB_NAME:               {{ .Values.postgres.database | quote }}
  DB_USER:               {{ .Values.postgres.username | quote }}
  RMSE_THRESHOLD:        "0.30"
  DRIFT_TOLERANCE:       "0.05"
  POLL_INTERVAL:         "30"
  POLL_TIMEOUT:          "3600"