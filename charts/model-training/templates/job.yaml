---
apiVersion: batch/v1
kind: Job
metadata:
  name: rul-training-job
  namespace: model-training
  labels:
    app: model-training
    model: rul-xgboost
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-training
        model: rul-xgboost
    spec:
      serviceAccountName: model-training-sa
      restartPolicy: Never
      containers:
        - name: trainer
          image: 982215135701.dkr.ecr.ap-southeast-1.amazonaws.com/phm/model-training:latest
          imagePullPolicy: Always
          args: ["src/train_RUL.py"]
          envFrom:
            - configMapRef:
                name: model-training-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-training-secrets
                  key: db-password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: anomaly-training-job
  namespace: model-training
  labels:
    app: model-training
    model: anomaly-autoencoder
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-training
        model: anomaly-autoencoder
    spec:
      serviceAccountName: model-training-sa
      restartPolicy: Never
      containers:
        - name: trainer
          image: 982215135701.dkr.ecr.ap-southeast-1.amazonaws.com/phm/model-training:latest
          imagePullPolicy: Always
          args: ["src/train_anomaly.py"]
          envFrom:
            - configMapRef:
                name: model-training-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-training-secrets
                  key: db-password
            - name: NORMAL_RUL_THRESHOLD
              value: "150"
            - name: SEQUENCE_LENGTH
              value: "30"
            - name: EPOCHS
              value: "50"
            - name: BATCH_SIZE
              value: "32"
            - name: LEARNING_RATE
              value: "0.001"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: registry-job
  namespace: model-training
  labels:
    app: model-registry
    model: promoter
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-registry
        model: promoter
    spec:
      serviceAccountName: model-training-sa
      restartPolicy: Never
      containers:
        - name: registry
          image: 982215135701.dkr.ecr.ap-southeast-1.amazonaws.com/phm/model-registry:latest
          imagePullPolicy: Always
          args: ["src/promote.py"]
          envFrom:
            - configMapRef:
                name: model-training-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: model-training-secrets
                  key: db-password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"