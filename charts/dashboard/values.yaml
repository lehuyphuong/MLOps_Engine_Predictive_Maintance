# values.yaml — dashboard chart

# -------------------------------------------------------------------
# Grafana
# -------------------------------------------------------------------
grafana:
  image:
    repository: grafana/grafana
    tag: "10.3.3"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  adminUser: admin
  resources:
    requests:
      cpu:    "100m"
      memory: "256Mi"
    limits:
      cpu:    "300m"
      memory: "512Mi"

# -------------------------------------------------------------------
# Shared data source config
# -------------------------------------------------------------------
config:
  gcpProject:    "aide2-494008"
  gcpRegion:     "us-central1"
  dataset:       "FD002"
  dbHost:        "10.72.1.3"    # terraform output db_private_ip
  dbPort:        "5432"
  dbName:        "phmdb"
  dbUser:        "phmadmin"
  redisHost:     "10.72.0.3"  # terraform output redis_host
  redisPort:     "6379"
  gcsRawBucket:  "phm-raw-data-aide2-494008"

# -------------------------------------------------------------------
# ServiceAccount / Workload Identity
# -------------------------------------------------------------------
serviceAccount:
  name: dashboard-sa
  gcpServiceAccount: "phm-model-serving@aide2-494008.iam.gserviceaccount.com"