# values.yaml — monitoring chart

# -------------------------------------------------------------------
# Grafana (monitoring instance — infra/pipeline dashboards)
# -------------------------------------------------------------------
grafana:
  image:
    repository: grafana/grafana
    tag: "10.3.3"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  adminUser: admin
  resources:
    requests:
      cpu:    "100m"
      memory: "256Mi"
    limits:
      cpu:    "300m"
      memory: "512Mi"

# -------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------
prometheus:
  image:
    repository: prom/prometheus
    tag: "v2.50.1"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 9090
  scrapeInterval: "15s"
  retentionTime: "7d"
  resources:
    requests:
      cpu:    "200m"
      memory: "512Mi"
    limits:
      cpu:    "500m"
      memory: "1Gi"

# -------------------------------------------------------------------
# Loki
# -------------------------------------------------------------------
loki:
  image:
    repository: grafana/loki
    tag: "2.9.4"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 3100
  retentionPeriod: "168h"   # 7 days
  resources:
    requests:
      cpu:    "100m"
      memory: "256Mi"
    limits:
      cpu:    "300m"
      memory: "512Mi"

# -------------------------------------------------------------------
# Promtail — DaemonSet that ships pod logs to Loki
# -------------------------------------------------------------------
promtail:
  image:
    repository: grafana/promtail
    tag: "2.9.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu:    "50m"
      memory: "64Mi"
    limits:
      cpu:    "100m"
      memory: "128Mi"

# -------------------------------------------------------------------
# Ingress — dev only, basic auth restricted
# -------------------------------------------------------------------
ingress:
  devIp: "34.121.66.38"   # kubectl get svc -n ingress-nginx-dev

# -------------------------------------------------------------------
# Scrape targets — namespaces and services Prometheus monitors
# -------------------------------------------------------------------
scrape:
  modelServingNamespace: "model-serving"
  modelServingService:   "model-serving-svc"
  modelServingPort:      "8080"