# values.yaml — model-serving chart

config:
  dataset:               "FD002"
  gcpProject:            "aide2-494008"
  gcpRegion:             "us-central1"
  gcsArtifactsBucket:    "phm-model-artifacts-aide2-494008"
  gcsRawBucket:          "phm-raw-data-aide2-494008"
  anomalyMinCycles:      "10"
  cvStabilityThreshold:  "0.15"

redis:
  host: "10.72.0.3"   # terraform output redis_host
  port: "6379"

deployment:
  replicas: 1
  image:
    repository: us-central1-docker.pkg.dev/aide2-494008/phm-model-serving/model-serving
    tag: latest
    pullPolicy: Always
  port: 8080
  resources:
    requests:
      cpu:    "200m"
      memory: "512Mi"
    limits:
      cpu:    "500m"
      memory: "640Mi"

serviceAccount:
  name: model-serving-sa
  # Email from: terraform output workload_identity_annotations
  gcpServiceAccount: "phm-model-serving@aide2-494008.iam.gserviceaccount.com"